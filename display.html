<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A2540" />
  <title>Customer Display · HOTELI POA</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0a2540;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:22px 5vw;background:#0a2540;color:white;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;letter-spacing:.1em}.welcome{text-align:center;padding:6vh 5vw 2vh}.welcome h1{font-size:clamp(2rem,5vw,4rem);margin:0}.welcome p{color:#607086}.ticket{width:min(760px,90vw);margin:0 auto 5vh;background:white;border:1px solid #e3e9f0;border-radius:20px;padding:clamp(20px,4vw,40px);box-shadow:0 12px 40px #0a25400c}.ticket h2{margin:0 0 18px}.line{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #edf0f4}.empty{text-align:center;color:#718096;padding:32px 0}.total{display:flex;justify-content:space-between;font-size:1.35rem;font-weight:800;padding-top:20px}.foot{text-align:center;color:#718096;padding:20px;font-size:.85rem}
  </style>
</head>
<body>
  <header class="top"><div class="logo">HOTELI POA</div><div>Customer Display</div></header>
  <main>
    <section class="welcome"><h1>Welcome</h1><p id="table"></p></section>
    <section class="ticket"><h2>Your order</h2><div id="lines" class="empty">Your items will appear here.</div><div id="total" class="total" hidden><span>Total</span><span>KSh 0.00</span></div><p id="status" class="foot">Waiting for your order…</p></section>
  </main>
  <footer class="foot">Powered by HOTELI POA</footer>
  <script>
    const params=new URLSearchParams(location.search),token=params.get('token');
    const lines=document.querySelector('#lines'),total=document.querySelector('#total'),statusText=document.querySelector('#status');
    document.querySelector('#table').textContent=params.get('table')||'';
    const money=value=>`KSh ${Number(value||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    function escapeHtml(value){const element=document.createElement('span');element.textContent=String(value||'');return element.innerHTML}
    function showCart(data){const items=data.items||[];if(!items.length){lines.className='empty';lines.textContent='Your items will appear here.';total.hidden=true;return}lines.className='';lines.innerHTML=items.map(item=>`<div class="line"><span>${escapeHtml(item.name)} × ${Number(item.qty||1)}</span><strong>${money(item.price*item.qty)}</strong></div>`).join('');const sum=items.reduce((n,item)=>n+Number(item.price||0)*Number(item.qty||1),0);total.hidden=false;total.lastElementChild.textContent=money(sum);statusText.textContent='Order in progress';if(data.table)document.querySelector('#table').textContent=data.table}
    if(!token){statusText.textContent='Open this display from Floor & Tables to connect securely.'}
    else{const stream=new EventSource('/api/pos/stream?token='+encodeURIComponent(token));stream.addEventListener('cart',event=>showCart(JSON.parse(event.data)));stream.addEventListener('snapshot',event=>{const payload=JSON.parse(event.data);document.querySelector('#table').textContent=payload.table||document.querySelector('#table').textContent;showCart(payload)});stream.addEventListener('order',event=>{const order=JSON.parse(event.data);statusText.textContent=`Order ${String(order.id).slice(0,8)} received · ${order.status}`});stream.onerror=()=>{statusText.textContent='Reconnecting to the POS…'}}
  </script>
</body>
</html>
