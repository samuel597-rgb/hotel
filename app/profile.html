<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e6fd9"><title>My profile · HOTELI POA</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app/customer.css"><script src="/shared/password-toggle.js" defer></script><script src="/app/profile.js" defer></script><link rel="stylesheet" href="/shared/nav-buttons.css"><script src="/shared/nav-buttons.js" defer></script></head><body class="profile-page"><header class="customer-header"><div id="hp-nav-slot"></div><a href="/" class="font-bold">HOTELI POA</a><a href="/">Menu</a></header><main class="profile-wrap"><h1>My profile</h1><section class="profile-card"><h2>Profile photo</h2><div class="profile-row"><img id="avatar" alt="Profile photo" src="/icons/logo-192.png"><label>Choose JPG, PNG or WEBP (up to 2 MB)<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp"></label></div><button id="save-avatar">Save photo</button><p id="avatar-status" role="status"></p></section><form id="profile-form" class="profile-card"><h2>Personal details</h2><label>Full name<input name="name" required minlength="2" autocomplete="name"></label><label>Username<input name="username" minlength="3" autocomplete="username"></label><label>Phone number<input name="phone" type="tel" required autocomplete="tel"></label><label>Email (optional)<input name="email" type="email" autocomplete="email"></label><label>Delivery address (optional)<textarea name="address" rows="3" autocomplete="street-address"></textarea></label><label>Landmark (optional)<input name="landmark"></label><button>Save details</button><p id="profile-status" role="status"></p></form><form id="password-form" class="profile-card" autocomplete="off"><h2>Change password</h2><label>Current password<div class="password-field"><input id="current-password" name="currentPassword" type="password" autocomplete="new-password" required><button
