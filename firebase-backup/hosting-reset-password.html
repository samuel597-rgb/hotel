<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset password · HOTELI POA</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-white p-7 shadow-xl sm:p-10">
    <a href="/" class="text-sm font-semibold text-blue-600">HOTELI POA</a>
    <h1 class="mt-5 text-2xl font-bold text-[#0A2540]">Choose a new password</h1>
    <p class="mt-2 text-sm text-slate-500">Enter the six-digit code from your email. It expires after one minute.</p>
    <form id="resetForm" class="mt-6 space-y-4">
      <label class="block text-sm font-medium text-slate-700" for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-slate-200 p-3" />
      <label class="block text-sm font-medium text-slate-700" for="code">Reset code</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required class="w-full rounded-lg border border-slate-200 p-3" />
      <label class="block text-sm font-medium text-slate-700" for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full rounded-lg border border-slate-200 p-3" />
      <label class="block text-sm font-medium text-slate-700" for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full rounded-lg border border-slate-200 p-3" />
      <button id="submitReset" type="submit" class="w-full rounded-lg bg-[#1E6FD9] py-3 font-semibold text-white">Update password</button>
      <p id="status" aria-live="polite" class="text-sm"></p>
    </form>
    <a id="signInLink" href="/" class="hidden mt-4 inline-block font-semibold text-blue-600">Return to sign in</a>
  </main>
  <script type="module">
    const form = document.getElementById('resetForm');
    const status = document.getElementById('status');
    const button = document.getElementById('submitReset');
    const email = document.getElementById('email');
    email.value = new URLSearchParams(location.search).get('email') || '';
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        status.textContent = 'The passwords do not match.';
        status.className = 'text-sm text-red-600';
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch('/api/complete-password-reset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), code: document.getElementById('code').value.trim(), newPassword: password })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Could not update your password.');
        status.textContent = 'Your password has been updated. You can now sign in.';
        status.className = 'text-sm text-emerald-700';
        form.classList.add('hidden');
        document.getElementById('signInLink').classList.remove('hidden');
        history.replaceState(null, '', location.pathname);
      } catch (error) {
        status.textContent = error.message || 'Could not update the password. Request a new code.';
        status.className = 'text-sm text-red-600';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
