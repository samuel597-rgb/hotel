services:
  - type: web
    name: hoteli-pos-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./hoteli_poa.db
      - key: USE_FIREBASE
        value: "false"
      - key: CORS_ORIGINS
        value: https://hoteli-pos-api.onrender.com,https://hotel-c5f3.onrender.com,https://samuel597-rgb.github.io
