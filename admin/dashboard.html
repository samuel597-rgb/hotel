<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin workspace · HOTELI POA</title><link rel="stylesheet" href="/admin/admin.css"><script src="/shared/theme.js" defer></script><script src="/shared/api.js" defer></script><script src="/shared/mobile-drawer.js" defer></script><script src="/admin/admin.js" defer></script></head><body><div class="shell"><aside class="side" data-mobile-drawer><strong>HOTELI POA</strong><a href="/admin/dashboard.html">Dashboard</a><a href="/app/#products">Products</a><a href="/app/#orders">Orders</a><a href="/app/#settings">Settings</a><a href="/app/#messages">Messages</a><button id="logout" class="hp-button">Sign out</button></aside><main><header class="top"><button type="button" data-drawer-toggle aria-expanded="false" aria-label="Open navigation" style="display:none">☰</button><strong>Admin workspace</strong><span id="user-badge" class="hp-muted"></span><button class="theme" data-theme-toggle aria-label="Toggle theme">🌙</button></header><section class="content"><h1>Dashboard</h1><div id="summary" class="grid"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2>Live orders</h2><div><label class="hp-muted"><input id="order-alerts" type="checkbox"> Flash tab for new orders</label> <button id="refresh-orders" class="theme" type="button">Refresh</button></div></div><div id="orders" class="grid"></div><div class="grid" style="margin-top:20px"><section class="hp-card card"><h2>Staff management</h2><form id="staff-form" style="display:grid;gap:10px"><input class="hp-input" name="name" required placeholder="Full name"><input class="hp-input" name="phone" required placeholder="Phone"><select class="hp-input" name="role"><option value="front_desk">Front desk</option><option value="kitchen">Kitchen</option><option value="manager">Manager</option><option value="employee">Employee</option></select><input class
